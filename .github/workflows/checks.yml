name: Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install '.[test,demo]' ruff build
      - run: ruff check src tests scripts benchmarks demo app.py
      - run: pytest -q
      - run: python -m build
