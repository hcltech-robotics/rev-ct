  <g id="text_34">
   <text style="font-size: 11px; font-family: 'STIXGeneral'; text-anchor: start; fill: #666666" x="51.84" y="93.312" transform="rotate(-0 51.84 93.312)">Bar = mean   ·   dot = p95   ·   annotation = mean / p95 seconds</text>
  </g>
  <g id="text_35">
   <text style="font-size: 10px; font-family: 'STIXGeneral'; fill: #666666" transform="translate(51.84 459.82275)">Warm local NIfTI → CPU-visible output; downloads and model loading excluded. Same scans in all rows.</text>
   <text style="font-size: 10px; font-family: 'STIXGeneral'; fill: #666666" transform="translate(51.84 472.263375)">Rev uses fp32; NV and COLIPRI use bf16. Pillar rows produce features, with no trained finding head.</text>
   <text style="font-size: 10px; font-family: 'STIXGeneral'; fill: #666666" transform="translate(51.84 484.704)">The NV list protocol produced 0/64 requested 18-key JSON mappings. See the benchmark report for protocols.</text>
  </g>
